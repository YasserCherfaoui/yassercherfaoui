name: Update LOC & Profile Stats

on:
  schedule:
    - cron: '0 0 * * *' # Every day at 00:00 UTC
  workflow_dispatch:     # Allows running on-demand from the Actions tab

jobs:
  update-stats:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Checkout profile repo
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Calculate LOC and update readme.md + stats.json
        env:
          STATS_TOKEN: ${{ secrets.STATS_TOKEN }}
        run: node scripts/update-stats.js

      - name: Commit and push if changed
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add stats.json readme.md
          git diff --staged --quiet || (git commit -m "chore: update live lines of code & stats [skip ci]" && git push)
